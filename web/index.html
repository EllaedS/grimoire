/* ---------- import ---------- */
function openImport(){const body=openDlg('Importer',`<p class="muted" style="margin:0">Dépose ton export complet Mythic Tools (<span class="mono">.csv</span>) pour mettre à jour la collection et les decks, ou ton relevé <span class="mono">sealed-prices.json</span> pour l'onglet Offres.</p>
  <div class="drop" id="drop" tabindex="0" role="button"><b>Choisir un fichier</b><br><span class="muted">ou le glisser ici</span></div><div id="imp-status"></div>`);
  const dz=body.querySelector('#drop');dz.onclick=()=>$('#file-input').click();dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#file-input').click()}};
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)handleFile(f)}}
function impStatus(html){const el=$('#imp-status');if(el)el.innerHTML=html}
async function handleFile(f){if(!$('#dlg').open)openImport();
  const txt=await f.text();
  if(/\.json$/i.test(f.name)||txt.trim().startsWith('[')||txt.trim().startsWith('{')){return importOffres(f,txt)}
  const p=parseCSV(txt);const miss=REQ.filter(h=>!p.headers.includes(h));
  if(miss.length){impStatus(`<div class="alert bad"><div class="grow">Ce fichier n'est pas un export Mythic Tools : colonnes manquantes (${miss.map(esc).join(', ')}).</div></div>`);return}
  const coll=buildColl(p.rows);
  const diff=diffColl(S.coll,coll);
  if(!S.db||!S.assets){S.coll=coll;_usage=null;impStatus(`<div class="alert warn"><div class="grow">${coll.total} cartes chargées pour cette session uniquement : l'enregistrement en ligne n'est pas disponible ici.</div></div>`);render();return}
  impStatus(`<div class="alert"><div class="grow">Enregistrement de ${coll.total.toLocaleString('fr-FR')} cartes…</div></div>`);
  try{const up=await S.assets.upload(new Blob([txt],{type:'text/csv'}),{type:'text/csv'});
    const prev=S.state||{};const hist=[...(prev.history||[])];if(prev.csv)hist.unshift(prev.csv);
    const csv={id:up.id,name:f.name,size:up.sizeBytes,rows:p.rows.length,total:coll.total,uploadedAt:new Date().toISOString()};
    S.coll=coll;S.csvId=up.id;_usage=null;
    await dbSet('app/state',{csv,history:hist.slice(0,12),lastDiff:diff});
    const unk=unknownKeys().length;
    impStatus(`<div class="alert ok"><div class="grow"><b>Collection mise à jour.</b> ${coll.total.toLocaleString('fr-FR')} cartes, ${coll.unique.toLocaleString('fr-FR')} uniques. ${diff?`+${diff.addedQ} / −${diff.removedQ} cartes depuis le précédent import.`:''} ${unk?`${unk} carte(s) à compléter.`:''}</div></div>
      <div class="row">${unk?'<button class="btn primary" id="imp-enrich">Compléter les cartes</button>':''}<button class="btn" id="imp-done">Fermer</button></div>`);
    const b1=$('#imp-enrich');if(b1)b1.onclick=openEnrich;$('#imp-done').onclick=()=>$('#dlg').close();render();
    if(unk&&(S.local||S.mcp)){toast(`Collection mise à jour : +${diff?diff.addedQ:0} / −${diff?diff.removedQ:0} cartes`);runEnrich(unknownKeys());openEnrich()}}
  catch(e){impStatus(`<div class="alert bad"><div class="grow">L'enregistrement a échoué (${esc(e.code||e.message)}). Réessaie dans un instant.</div></div>`)}}
function diffColl(a,b){if(!a)return null;const add=[],rem=[];let aq=0,rq=0;const fmt=(n,bb,q)=>({en:bb.en,fr:bb.fr||'',q});
  for(const [n,x] of b.byEn){const old=a.byEn.get(n);const d=x.q-(old?old.q:0);if(d>0){add.push(fmt(n,x,d));aq+=d}}
  for(const [n,x] of a.byEn){const nw=b.byEn.get(n);const d=(nw?nw.q:0)-x.q;if(d<0){rem.push(fmt(n,x,d));rq+=-d}}
  add.sort((x,y)=>y.q-x.q);rem.sort((x,y)=>x.q-y.q);
  return {at:new Date().toISOString(),addedQ:aq,removedQ:rq,addedN:add.length,removedN:rem.length,added:add.slice(0,60),removed:rem.slice(0,60)}}
async function importOffres(f,txt){let data;try{data=JSON.parse(txt)}catch(e){impStatus('<div class="alert bad"><div class="grow">Ce JSON est illisible.</div></div>');return}
  const items=(Array.isArray(data)?data:(data.products||data.items||[])).map(x=>({edition:x.edition||'',set_code:x.set_code||'',product_type:x.product_type||'',product_label:x.product_label||'',total_cards:x.total_cards??null,price:typeof x.price==='number'?x.price:parseFloat(x.price)||null,price_per_card:typeof x.price_per_card==='number'?x.price_per_card:null,store:x.store||'',url:x.url||'',in_stock:x.in_stock!==false,fetched_at:x.fetched_at||''}));
  if(!items.length){impStatus('<div class="alert bad"><div class="grow">Aucun produit trouvé dans ce fichier.</div></div>');return}
  const fetchedAt=items.map(x=>x.fetched_at).filter(Boolean).sort().pop()||'';
  if(!S.db){S.offres={items,fetchedAt};render();impStatus('<div class="alert warn"><div class="grow">Offres chargées pour cette session uniquement.</div></div>');return}
  try{await dbSet('app/offres',{items,fetchedAt,importedAt:new Date().toISOString(),file:f.name});impStatus(`<div class="alert ok"><div class="grow">${items.length} offres importées.</div></div>`);location.hash='offres'}
  catch(e){impStatus(`<div class="alert bad"><div class="grow">L'enregistrement a échoué (${esc(e.code||e.message)}).</div></div>`)}}

/* ---------- enrichment via Claude's browser + Scryfall ---------- */
function fmtEta(s){s=Math.max(1,Math.round(s));return s<60?`${s} s`:s<3600?`${Math.round(s/60)} min`:`${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min`}
function enrProgressHTML(){const p=S.enr;if(!p)return '';const pct=p.total?Math.floor(p.processed/p.total*100):0;const el=(Date.now()-p.startedAt)/1000;
  const eta=p.running&&p.processed>0?el/p.processed*(p.total-p.processed):null;
  return `<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><b>${p.running?'Intégration des nouvelles cartes…':(p.stopped?'Intégration arrêtée':'Intégration terminée')}</b><span class="num">${p.processed.toLocaleString('fr-FR')} / ${p.total.toLocaleString('fr-FR')} · ${pct} %</span></div>
  <div class="progress" role="progressbar" aria-label="Avancement" aria-valuemin="0" aria-valuemax="${p.total}" aria-valuenow="${p.processed}"><i style="width:${pct}%"></i></div>
  <div class="muted" style="font-size:.85rem">${p.done.toLocaleString('fr-FR')} ajoutée(s)${p.fail.length?` · ${p.fail.length} introuvable(s)`:''}${eta!=null?` · environ ${fmtEta(eta)} restante(s)`:` · ${fmtEta(el)} au total`}${p.msg?' · '+esc(p.msg):''}</div></div>`}
let _enrT=0;function enrUpdate(force){const now=Date.now();if(!force&&now-_enrT<150)return;_enrT=now;
  for(const id of ['enr-prog','enr-strip']){const el=document.getElementById(id);if(el)el.innerHTML=enrProgressHTML()}
  const l=$('#enr-log');if(l&&S.enr){l.textContent=S.enr.log.join('\n');l.scrollTop=1e9}
  const st=$('#enr-stop');if(st)st.hidden=!(S.enr&&S.enr.running)}
function openEnrich(){const running=S.enr&&S.enr.running;const unk=unknownKeys();
  const intro=S.local?'Grimoire lit leurs fiches sur Scryfall puis les enregistre dans la base.':'La page lit leurs fiches sur Scryfall via le navigateur intégré de l\'app Claude desktop, puis les enregistre dans la base.';
  openDlg('Compléter les cartes',`${running||S.enr?'':`<p style="margin:0">${unk.length} carte(s) du CSV n'ont pas encore de texte oracle. ${intro}</p>`}
  ${!S.mcp&&!S.local?'<div class="alert warn"><div class="grow">Le navigateur intégré n\'est pas accessible depuis cette vue. Ouvre cette page dans l\'app Claude desktop pour compléter les cartes.</div></div>':''}
  <div id="enr-prog">${enrProgressHTML()}</div>
  <div class="log" id="enr-log">${S.enr?esc(S.enr.log.join('\n')):unk.slice(0,40).map(e=>esc(`${e.set.toUpperCase()} #${e.num} · ${e.fr||e.en}`)).join('\n')+(unk.length>40?'\n…':'')}</div>
  <p class="muted" style="margin:0;font-size:.85rem">Tu peux fermer cette fenêtre : l'intégration continue et la barre reste visible en haut de la page.</p>
  <div class="row">${!running&&unk.length?`<button class="btn primary" id="enr-go" ${(!S.mcp&&!S.local)?'disabled':''}>${S.enr?'Relancer pour les cartes restantes':'Lancer'}</button>`:''}<button class="btn" id="enr-stop" ${running?'':'hidden'}>Arrêter</button><button class="btn" id="enr-close">Fermer</button></div>`);
  const l=$('#enr-log');if(l)l.scrollTop=1e9;
  $('#enr-close').onclick=()=>$('#dlg').close();$('#enr-stop').onclick=()=>{if(S.enr){S.enr.stop=true;S.enr.msg='arrêt après le lot en cours'};enrUpdate(true)};
  const go=$('#enr-go');if(go)go.onclick=()=>{runEnrich(unknownKeys());openEnrich()}}
function scryToCard(c,key,fr){const f=c.card_faces||[];const lg=c.legalities||{};
  return {key,e:c.name,f:fr&&fr!==c.name?fr:undefined,o:c.oracle_text!=null?c.oracle_text:f.map(x=>x.name+' — '+(x.oracle_text||'')).join('\n\n'),c:c.cmc||0,k:(c.color_identity||[]).join(''),m:c.mana_cost!=null&&c.mana_cost!==''?c.mana_cost:((f[0]&&f[0].mana_cost)||''),t:c.type_line||(f.map(x=>x.type_line).join(' // ')),r:c.rarity||'',l:(lg.pauper==='legal'?'P':'')+(lg.commander==='legal'?'C':''),src:'scryfall',at:new Date().toISOString()}}
async function browserJson(url){await S.mcp.callTool('host:claude_browser','navigate',{url});
  const r=await S.mcp.callTool('host:claude_browser','get_page_text',{max_chars:900000});
  let txt=typeof r.payload==='string'?r.payload:((r.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n'));
  if(r.payload&&typeof r.payload==='object'&&r.payload.object)return r.payload;
  const i=txt.indexOf('{'),j=txt.lastIndexOf('}');if(i<0||j<i)throw new Error('Réponse Scryfall illisible');return JSON.parse(txt.slice(i,j+1))}
async function pool(fns,n){let i=0;await Promise.all(Array.from({length:Math.min(n,fns.length)},async()=>{while(i<fns.length){const f=fns[i++];await f()}}))}
async function runEnrich(unk){if((S.enr&&S.enr.running)||!unk.length||(!S.mcp&&!S.local))return;
  const p=S.enr={total:unk.length,done:0,processed:0,fail:[],startedAt:Date.now(),running:true,stop:false,stopped:false,log:[],msg:''};
  const say=s=>{p.log.push(s);if(p.log.length>400)p.log.shift();enrUpdate()};
  render();const BS=S.local?70:12;const nb=Math.ceil(unk.length/BS);
  try{for(let i=0,n=1;i<unk.length;i+=BS,n++){if(p.stop){p.stopped=true;break}
    const batch=unk.slice(i,i+BS);p.msg=`lot ${n}/${nb}`;say(`Lot ${n}/${nb} : ${batch.length} carte(s)…`);
    let found=new Map(),fatal=null;
    try{if(S.local){const res=await window.grimoireLocal.fetchJson('https://api.scryfall.com/cards/collection',{method:'POST',body:JSON.stringify({identifiers:batch.map(e=>({set:e.set,collector_number:e.num}))})});for(const c of res.data||[])found.set((c.set+'|'+c.collector_number).toLowerCase(),c)}
      else{const q=batch.map(e=>`(e:${e.set} cn:"${e.num}")`).join(' or ');let res=await browserJson('https://api.scryfall.com/cards/search?q='+encodeURIComponent(q)+'&unique=prints&include_extras=true&include_variations=true');for(const c of res.data||[])found.set((c.set+'|'+c.collector_number).toLowerCase(),c);
        if(res.has_more&&res.next_page){res=await browserJson(res.next_page);for(const c of res.data||[])found.set((c.set+'|'+c.collector_number).toLowerCase(),c)}}}
    catch(e){if(e&&e.code==='not_granted')fatal='Accès au navigateur refusé.';else if(e&&(e.code==='server_not_connected'||e.code==='not_in_manifest'))fatal='Navigateur intégré indisponible : ouvre la page dans l\'app Claude desktop.';else say('  Échec de la recherche ('+(e.code||e.message)+')')}
    if(fatal){say(fatal);p.msg=fatal;p.stopped=true;break}
    await pool(batch.map(e=>async()=>{const c=found.get(e.key);
      if(!c){p.fail.push(e);say(`  ✗ ${e.set.toUpperCase()} #${e.num} ${e.fr||e.en} : introuvable`)}
      else{const doc=scryToCard(c,e.key,e.fr);Object.keys(doc).forEach(k=>doc[k]===undefined&&delete doc[k]);
        try{await dbSet('cards_extra/'+docIdForKey(e.key),doc);S.extra[e.key]=doc;p.done++;say(`  ✓ ${doc.f||doc.e}`)}catch(err){p.fail.push(e);say(`  ✗ ${e.en} (${err.code||err.message})`)}}
      p.processed++;enrUpdate()}),6);
    await new Promise(r=>setTimeout(r,S.local?80:250))}}
  finally{p.running=false;p.msg='';rebuildIndex();say(`\n${p.stopped?'Arrêté':'Terminé'} : ${p.done} carte(s) ajoutée(s)${p.fail.length?`, ${p.fail.length} introuvable(s)`:''}.`);
    enrUpdate(true);render();toast(`${p.done} carte(s) intégrée(s) à la base`)}}

/* ---------- deck settings ---------- */
function openDeckSettings(d,cont){const isNew=!d;d=d||{name:cont?cont.replace(/ - main$/i,''):'',format:'Commander',container:cont||'',side:'',commander:'',difficulty:''};
  const conts=S.coll?[...S.coll.conts.values()].sort((a,b)=>a.name.localeCompare(b.name)):[];
  const opt=(v,cur)=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v||'— aucun —')}</option>`;
  const body=openDlg(isNew?'Nouveau deck':'Réglages du deck',`<div class="two">
    <div class="field"><label for="ds-name">Nom</label><input id="ds-name" value="${esc(d.name)}"></div>
    <div class="field"><label for="ds-format">Format</label><select id="ds-format">${['Commander','Pauper','Standard','Modern','Autre'].map(f=>opt(f,d.format)).join('')}</select></div>
    <div class="field"><label for="ds-cont">Classeur Mythic Tools (liste principale)</label><select id="ds-cont">${opt('',d.container)}${conts.map(c=>opt(c.name,d.container)).join('')}</select></div>
    <div class="field"><label for="ds-side">Classeur réserve (optionnel)</label><select id="ds-side">${opt('',d.side)}${conts.map(c=>opt(c.name,d.side)).join('')}</select></div>
    <div class="field"><label for="ds-cmd">Commandant (nom anglais)</label><input id="ds-cmd" value="${esc(d.commander)}" list="ds-cmd-list"></div>
    <div class="field"><label for="ds-diff">Difficulté</label><input id="ds-diff" value="${esc(d.difficulty||'')}"></div>
    <div class="field"><label for="ds-max">Swaps max par analyse</label><input id="ds-max" type="number" min="1" max="50" value="${d.maxSwaps||10}"></div></div>
    <p class="muted" style="margin:0;font-size:.85rem">Sans classeur, le deck est une liste manuelle (bouton « Modifier la liste ») ; ses cartes restent réservées dans le calcul de disponibilité.</p>
    <div class="row"><button class="btn primary" id="ds-save">Enregistrer</button><button class="btn" id="ds-cancel">Annuler</button>${!isNew?'<span class="spacer"></span><button class="btn danger" id="ds-del">Supprimer le deck</button>':''}</div><div id="ds-msg"></div>`);
  $('#ds-cancel').onclick=()=>$('#dlg').close();
  $('#ds-save').onclick=async()=>{const data={name:$('#ds-name').value.trim()||'Sans nom',format:$('#ds-format').value,container:$('#ds-cont').value,side:$('#ds-side').value,commander:$('#ds-cmd').value.trim(),difficulty:$('#ds-diff').value.trim(),maxSwaps:Math.max(1,Math.min(50,+$('#ds-max').value||10)),updatedAt:new Date().toISOString()};
    if(data.commander&&!cardByName(data.commander)){$('#ds-msg').innerHTML='<div class="alert warn"><div class="grow">Commandant introuvable dans la base : vérifie le nom anglais exact.</div></div>';return}
    try{if(isNew){let id=slug(data.name);while(S.decks[id])id+='-2';await dbSet('decks/'+id,{...data,order:deckList().length+1,strat:'',notes:'',list:[]});await dbSet('swaps/'+id,{intro:'',items:[],acq:[]});$('#dlg').close();location.hash='deck-'+id}
      else{await dbUpdate('decks/'+d.id,data);$('#dlg').close();toast('Réglages enregistrés')}}catch(e){$('#ds-msg').innerHTML=`<div class="alert bad"><div class="grow">Échec (${esc(e.code||e.message)}).</div></div>`}};
  const del=$('#ds-del');if(del)del.onclick=async()=>{if(del.dataset.confirm!=='1'){del.dataset.confirm='1';del.textContent='Confirmer la suppression';return}
    try{await serial('decks/'+d.id,()=>S.db.doc('decks/'+d.id).delete());await serial('swaps/'+d.id,()=>S.db.doc('swaps/'+d.id).delete());$('#dlg').close();location.hash='decks';toast('Deck supprimé')}catch(e){toast('Échec : '+(e.code||e.message))}}}
function openListEditor(d){const txt=(d.list||[]).map(x=>`${x.qty} ${x.en}`).join('\n');
  openDlg('Liste de '+d.name,`<p class="muted" style="margin:0">Une carte par ligne : quantité puis nom anglais ou français (ex. « 1 Sol Ring »).</p><textarea class="edit" id="le-ta" style="min-height:320px">${esc(txt)}</textarea><div id="le-msg"></div><div class="row"><button class="btn primary" id="le-save">Enregistrer</button><button class="btn" id="le-cancel">Annuler</button></div>`);
  $('#le-cancel').onclick=()=>$('#dlg').close();
  $('#le-save').onclick=async()=>{const list=[],bad=[];for(const line of $('#le-ta').value.split('\n')){const m=line.trim().match(/^(\d+)\s*x?\s+(.+)$/i);if(!line.trim())continue;const q=m?+m[1]:1,nm=(m?m[2]:line).trim();const c=cardByName(nm);if(!c)bad.push(nm);list.push({en:c?c.e:nm,qty:q})}
    if(bad.length&&$('#le-save').dataset.force!=='1'){$('#le-msg').innerHTML=`<div class="alert warn"><div class="grow">Introuvables dans la base : ${bad.map(esc).join(', ')}. Clique encore sur Enregistrer pour les garder quand même.</div></div>`;$('#le-save').dataset.force='1';return}
    try{await dbUpdate('decks/'+d.id,{list,updatedAt:new Date().toISOString()});$('#dlg').close();toast('Liste enregistrée')}catch(e){$('#le-msg').innerHTML=`<div class="alert bad"><div class="grow">Échec (${esc(e.code||e.message)}).</div></div>`}}}

/* ---------- Claude analysis ---------- */
function openAnalyse(d){const max=d.maxSwaps||10;
  const body=openDlg('Réévaluer '+d.name,`<p style="margin:0">Claude relit la liste avec les textes oracle, cherche dans ta collection les cartes libres compatibles, puis propose jusqu'à ${max} swaps de cartes et des ajustements de terrains.</p>
  <div class="field"><label for="an-focus">Axe à renforcer (optionnel)</label><textarea id="an-focus" class="edit" style="min-height:70px" placeholder="Ex. : plus de pioche, protéger le commandant contre les wraths, réduire la courbe…"></textarea></div>
  <div class="row"><button class="btn primary" id="an-go">Lancer l'analyse</button><button class="btn" id="an-stop" hidden>Arrêter</button></div>
  <div class="log" id="an-log" hidden></div><div id="an-out"></div>`);
  let ctl=null;$('#an-stop').onclick=()=>ctl&&ctl.abort();
  $('#an-go').onclick=async()=>{const go=$('#an-go');go.disabled=true;$('#an-stop').hidden=false;const log=$('#an-log');log.hidden=false;log.textContent='Claude réfléchit…';
    ctl=new AbortController();const say=s=>{log.textContent+='\n'+s;log.scrollTop=1e9};
    try{const res=await runAnalysis(d,$('#an-focus').value.trim(),say,ctl.signal);showAnalysis(d,res)}
    catch(e){const msg={not_granted:'Accès à Claude refusé pour cette page.',rate_limited:'Limite d\'utilisation atteinte : réessaie plus tard.',cancelled:'Analyse arrêtée.'}[e.code]||('L\'analyse a échoué ('+(e.code||e.message)+').');say(msg)}
    finally{go.disabled=false;$('#an-stop').hidden=true}}}
function cardLine(x){const c=x.card||{};return `${x.qty}x ${x.en}${x.fr&&x.fr!==x.en?` [FR: ${x.fr}]`:''}${x.isCmd?' (COMMANDANT)':''} | ${c.m||'-'} | ${c.t||'?'} | ${(c.o||'(oracle inconnu)').replace(/\n/g,' / ')}`}
async function runAnalysis(d,focus,say,signal){const cards=deckCards(d);const st=deckStats(d,cards);const doc=S.swaps[d.id]||{};const inSet=new Set(cards.map(x=>x.n));
  const pending=(doc.items||[]).filter(s=>swapStatus(s,d,inSet).k!=='applied').map(s=>`${s.out.en} -> ${s.in.en}`);
  const max=d.maxSwaps||10;const fmtCode=d.format==='Pauper'?'P':'C';
  const prompt=`Tu es l'expert Magic: The Gathering de Fred. Tu réévalues un de ses decks et tu proposes des swaps UNIQUEMENT avec des cartes de sa collection qui sont libres (pas utilisées dans un autre deck).

RÈGLES ABSOLUES
- Ne décris jamais une carte sans avoir lu son texte oracle (fourni ci-dessous pour le deck, via les outils pour la collection). Lis l'oracle EN ENTIER.
- Chaque carte IN doit venir de search_collection ou get_card avec avail >= 1, être dans l'identité de couleur ${st.id||'incolore'} et légale en ${d.format}.
- Chaque carte OUT doit être dans la liste actuelle. Ne propose jamais le commandant en OUT. Si les notes disent que Fred tient à une carte, ne la sors pas.
- Effets landfall multiples = effet cumulatif puissant, jamais redondant. Seuls les effets permanents (marqueurs +1/+1, jetons, récursion) ou la pioche comptent ; un bonus temporaire (+X/+X jusqu'à la fin du tour) n'intéresse pas Fred.
- Les grosses créatures sont une condition de victoire valable (elles créent de l'urgence).
- Au plus ${max} swaps de cartes. Pas obligé de les remplir si rien n'est convaincant. Ne repropose pas un swap déjà en attente.
- Ajoute des ajustements de terrains (kind "basics" pour échanger des terrains de base, kind "land" pour un terrain non-basique) si la production de couleur ne colle pas à la demande.
- Raisons courtes en français (2-3 phrases), qui citent le mécanisme exact de l'oracle.

DECK : ${d.name} — format ${d.format}${d.commander?` — commandant ${d.commander}`:''} — identité ${st.id||'incolore'}
Stratégie actuelle : ${d.strat||'(aucune)'}
Notes de Fred : ${d.notes||'(aucune)'}
${focus?`AXE DEMANDÉ PAR FRED : ${focus}\n`:''}Stats : ${st.total} cartes, CMC moyen ${st.avg.toFixed(2)}, ${st.landq} terrains dont ${st.basicsq} de base. Courbe 0..7+ : ${st.curve.join('/')}. Symboles de mana par couleur : ${COLORS.filter(c=>st.id.includes(c)).map(c=>c+'='+st.demand[c].toFixed(1)).join(', ')}. Sources terrain : ${COLORS.filter(c=>st.id.includes(c)).map(c=>c+'='+st.sources[c]).join(', ')}.
Swaps déjà en attente : ${pending.join(' ; ')||'aucun'}

LISTE ACTUELLE (qty | nom | coût | type | oracle)
${cards.map(cardLine).join('\n')}

Utilise search_collection plusieurs fois (par mots-clés oracle liés aux axes du deck) avant de conclure.
RÉPONSE FINALE : uniquement un objet JSON, sans texte autour :
{"strategy":"2-4 phrases : comment jouer le deck, axes, plan de victoire (après tes swaps)","intro":"1-3 phrases : quelle amélioration ces swaps cherchent","swaps":[{"out":"nom anglais exact","in":"nom anglais exact","reason":"..."}],"lands":[{"kind":"basics|land","out":"nom anglais","in":"nom anglais","qty":1,"reason":"..."}]}`;
  const tools=[{name:'search_collection',description:'Cherche dans la collection de Fred les cartes LIBRES (avail>=1), hors de ce deck, dans l\'identité de couleur du deck et légales dans son format. Retourne jusqu\'à 30 cartes avec nom anglais, nom FR, coût, type, oracle complet et quantité libre.',
      inputSchema:{type:'object',properties:{text:{type:'string',description:'Mots à trouver tous dans le nom, le type ou l\'oracle (anglais), ex. "draw a card" ou "+1/+1 counter"'},type:{type:'string',enum:['Créature','Éphémère','Rituel','Artéfact','Enchantement','Planeswalker','Terrain']},max_cmc:{type:'number'},limit:{type:'number'}}},
      execute:(inp)=>{const terms=norm(String(inp.text||'')).split(' ').filter(Boolean);const type=inp.type?String(inp.type):'';const mx=inp.max_cmc!=null?Number(inp.max_cmc):99;const lim=Math.min(30,Number(inp.limit)||25);
        say(`🔎 ${inp.text||''}${type?' · '+type:''}${inp.max_cmc!=null?' · CMC≤'+mx:''}`);const out=[];
        for(const [n,b] of S.coll.byEn){if(inSet.has(n)||isBasic(n))continue;const {card}=nameInfo(n);if(!card||!card.o&&!card.t)continue;
          if(!withinIdentity(card.k,st.id))continue;if(card.l!==undefined&&!card.l.includes(fmtCode))continue;if(type&&catOf(card,false)!==type)continue;if((card.c||0)>mx)continue;
          if(terms.length){const hay=norm(card.e+' '+(card.t||'')+' '+(card.o||''));if(!terms.every(t=>hay.includes(t)))continue}
          const av=availFor(n,d.id);if(av<1)continue;out.push({en:card.e,fr:b.fr||card.f||'',mana:card.m,type:card.t,cmc:card.c,oracle:card.o,avail:av});if(out.length>=lim)break}
        return out}},
    {name:'get_card',description:'Lit une carte par nom (anglais ou français) : oracle complet, coût, type, identité, légalité, quantité possédée, quantité libre pour ce deck, et si elle est déjà dans le deck.',
      inputSchema:{type:'object',properties:{name:{type:'string'}},required:['name']},
      execute:(inp)=>{const c=cardByName(String(inp.name||''));if(!c)throw new Error('Carte inconnue de la base : '+inp.name);const n=norm(c.e);say(`📖 ${c.e}`);
        return {en:c.e,fr:c.f||frOf(c.e),mana:c.m,type:c.t,cmc:c.c,identity:c.k,oracle:c.o,legal_commander:(c.l||'').includes('C'),legal_pauper:(c.l||'').includes('P'),owned:owned(n),avail:availFor(n,d.id),in_deck:inSet.has(n)}}}];
  const res=await S.sample.json(prompt,{tools,modelTier:'complex',signal,cache:false,onText:()=>{}});
  return validate(d,res,cards,st,max)}
function validate(d,res,cards,st,max){const inSet=new Set(cards.map(x=>x.n));const ok=[],bad=[];const usedIn=new Set();
  for(const s of (res&&res.swaps)||[]){const o=cardByName(s.out),i=cardByName(s.in);const on=norm(o?o.e:s.out),inn=norm(i?i.e:s.in);
    let why='';if(!inSet.has(on))why='OUT absent du deck';else if(norm(d.commander)===on)why='OUT = commandant';else if(!i)why='IN inconnue';else if(inSet.has(inn))why='IN déjà dans le deck';else if(availFor(inn,d.id)<1)why='IN non disponible';else if(!withinIdentity(i.k,st.id))why='IN hors identité';else if(usedIn.has(inn))why='IN proposée deux fois';
    if(why)bad.push({...s,why});else{usedIn.add(inn);ok.push({kind:'card',out:{en:o.e,fr:o.f||frOf(o.e)},in:{en:i.e,fr:i.f||frOf(i.e)},qty:1,reason:s.reason||''})}}
  for(const s of (res&&res.lands)||[]){const o=cardByName(s.out),i=cardByName(s.in);const kind=s.kind==='basics'?'basics':'land';
    if(!o||!i){bad.push({...s,why:'Terrain inconnu'});continue}
    if(kind==='land'&&availFor(norm(i.e),d.id)<1&&!isBasic(i.e)){bad.push({...s,why:'IN non disponible'});continue}
    ok.push({kind,out:{en:o.e,fr:o.f||frOf(o.e)},in:{en:i.e,fr:i.f||frOf(i.e)},qty:Math.max(1,+s.qty||1),reason:s.reason||''})}
  return {strategy:res&&res.strategy||'',intro:res&&res.intro||'',ok:ok.slice(0,max+10),bad}}
function showAnalysis(d,res){const out=$('#an-out');if(!out)return;
  out.innerHTML=`<div class="stack" style="gap:10px">${res.strategy?`<div><h3>Stratégie proposée</h3><p class="prose" style="margin:4px 0">${esc(res.strategy)}</p></div>`:''}
    <div><h3>${res.ok.length} recommandation(s)</h3>${res.ok.map(s=>`<div class="swap"><div class="pair"><span class="out">${esc(s.out.fr||s.out.en)}</span><span class="arrow">→</span><span>${s.qty>1?s.qty+'× ':''}${esc(s.in.fr||s.in.en)}</span><span class="pill">${s.kind==='card'?'carte':'terrain'}</span></div><div class="why">${esc(s.reason)}</div></div>`).join('')||'<p class="muted">Aucune.</p>'}</div>
    ${res.bad.length?`<details><summary>${res.bad.length} proposition(s) écartée(s) par les contrôles</summary>${res.bad.map(s=>`<div class="muted" style="font-size:.85rem">${esc(s.out)} → ${esc(s.in)} : ${esc(s.why)}</div>`).join('')}</details>`:''}
    ${S.canWrite?`<label class="row" style="gap:6px"><input type="checkbox" id="an-strat" ${res.strategy?'checked':''}> Remplacer le texte de stratégie et l'intro des swaps</label>
    <div class="row"><button class="btn primary" id="an-save" ${!res.ok.length&&!res.strategy?'disabled':''}>Ajouter aux recommandations</button></div>`:''}</div>`;
  const sv=$('#an-save');if(sv)sv.onclick=async()=>{sv.disabled=true;const doc=S.swaps[d.id]||{items:[],acq:[]};const stamp=new Date().toISOString().slice(0,10);
    const items=[...(doc.items||[]),...res.ok.map((s,i)=>({...s,id:'a'+Date.now().toString(36)+i,src:'analyse Claude',added:stamp}))];
    try{const repl=$('#an-strat')&&$('#an-strat').checked;
      if(S.swaps[d.id])await dbUpdate('swaps/'+d.id,{items,...(repl&&res.intro?{intro:stamp+' : '+res.intro}:{})});else await dbSet('swaps/'+d.id,{intro:repl?res.intro:'',items,acq:[]});
      if(repl&&res.strategy)await dbUpdate('decks/'+d.id,{strat:res.strategy,updatedAt:new Date().toISOString()});
      $('#dlg').close();S.ui.swapView[d.id]='pending';toast(`${res.ok.length} recommandation(s) ajoutée(s)`)}catch(e){sv.disabled=false;toast('Échec : '+(e.code||e.message))}}}

boot();
</script>
